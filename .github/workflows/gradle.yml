name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (full log saved)
        run: ./gradlew build --console=plain 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}

      - name: Remove *-sources.jar
        if: always()
        run: rm -f ./build/libs/*-sources.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thunderhack
          path: build/libs/*.jar
